<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGEIS — Chinese → English Translator</title>
  <style>
    /* ── Reset & Base ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d12;
      --surface:  #161622;
      --surface2: #1e1e30;
      --accent:   #6366f1;
      --accent2:  #ec4899;
      --text:     #f1f5f9;
      --muted:    #94a3b8;
      --border:   #2d2d44;
      --success:  #10b981;
      --error:    #ef4444;
      --radius:   16px;
    }

    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 16px 48px;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header h1 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 1rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 14px;
      color: var(--muted);
      margin-top: 12px;
    }
    .badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }
    .badge span { color: var(--text); font-weight: 600; }

    /* ── Main Card ───────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 760px;
      padding: 28px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.45);
    }

    /* ── Tabs ────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.95rem;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab-btn:hover { background: var(--surface2); color: var(--text); }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(99,102,241,0.35);
    }

    /* ── Panels ──────────────────────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }

    label.field-label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.05rem;
      padding: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    /* ── Speech / Mic Panel ──────────────────────────────────── */
    .mic-container {
      background: var(--surface2);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .big-mic-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      color: #fff;
      font-size: 2.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 24px rgba(99,102,241,0.4);
    }
    .big-mic-btn:hover { transform: scale(1.05); }
    .big-mic-btn.listening {
      background: linear-gradient(135deg, #ef4444 0%, #f43f5e 100%);
      animation: pulse 1.3s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50%       { box-shadow: 0 0 0 16px rgba(239,68,68,0); }
    }
    .mic-status-text {
      font-size: 0.95rem;
      color: var(--muted);
    }

    /* ── Action Button ───────────────────────────────────────── */
    .action-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .action-btn:hover { opacity: 0.92; }
    .action-btn:active { transform: scale(0.99); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Output Box ──────────────────────────────────────────── */
    .output-section {
      margin-top: 28px;
      display: none;
    }
    .output-section.visible { display: block; }
    .detected-box {
      margin-bottom: 14px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 12px;
      padding: 14px;
    }
    .detected-box p {
      color: #c7d2fe;
      font-size: 1rem;
      line-height: 1.5;
    }
    .translation-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      min-height: 80px;
    }
    .translation-box p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text);
    }
    .box-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 5px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s, background 0.2s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface2); }

    /* ── Footer Info ─────────────────────────────────────────── */
    .footer-info {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      justify-content: center;
    }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.75rem;
      padding: 6px 12px;
      color: var(--muted);
    }
    .chip b { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <h1>🀄 NGEIS</h1>
    <p>Next-Gen Chinese → English Translator (Text & Speech)</p>
    <div class="badge">
      <div class="dot"></div>
      <span>24/7 Serverless</span> &nbsp;·&nbsp; Works anywhere on phone & desktop
    </div>
  </header>

  <div class="card">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('text', this)">
        📝 Text
      </button>
      <button class="tab-btn" onclick="switchTab('speech', this)">
        🎙️ Live Speech
      </button>
    </div>

    <!-- ── Text Panel ── -->
    <div id="panel-text" class="panel active">
      <label class="field-label" for="chinese-text">Chinese Text</label>
      <textarea id="chinese-text" placeholder="在这里输入或粘贴中文…&#10;(Enter or paste Chinese text here)"></textarea>
      <button class="action-btn" id="btn-text-translate" onclick="handleTextTranslate()">
        Translate to English
      </button>
    </div>

    <!-- ── Speech Panel ── -->
    <div id="panel-speech" class="panel">
      <div class="mic-container">
        <button class="big-mic-btn" id="mic-toggle-btn" onclick="toggleSpeechRecognition()" title="Click to speak">
          🎤
        </button>
        <div class="mic-status-text" id="mic-status-text">
          Click the microphone and speak in Chinese (普通话)
        </div>
      </div>
    </div>

    <!-- ── Output ── -->
    <div class="output-section" id="output-section">
      <div class="detected-box" id="detected-box" style="display: none;">
        <label class="field-label" style="color: #a5b4fc; margin-bottom: 4px;">🎙️ Recognized Chinese Speech</label>
        <p id="detected-text"></p>
      </div>

      <label class="field-label">English Translation</label>
      <div class="translation-box" id="translation-box">
        <div class="box-actions">
          <button class="icon-btn" id="tts-btn" onclick="speakTranslation()">🔊 Listen</button>
          <button class="icon-btn" id="copy-btn" onclick="copyTranslation()">📋 Copy</button>
        </div>
        <p id="translation-text"></p>
      </div>
    </div>

    <!-- ── Chips ── -->
    <div class="footer-info">
      <div class="chip">⚡ <b>Direct Cloud AI</b></div>
      <div class="chip">🎙️ <b>Chrome/Edge Web Speech API</b></div>
      <div class="chip">🌐 <b>Vercel & GitHub Pages Ready</b></div>
    </div>
  </div>

<script>
  /* ── Tab Switching ── */
  function switchTab(name, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');
  }

  /* ── Universal Chinese-to-English Translation Engine ── */
  async function translateChinese(text) {
    if (!text || !text.trim()) return "";
    
    // 1. Google Translate GTx (Fast, ultra-reliable, zero-key)
    try {
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=" + encodeURIComponent(text);
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (data && data[0]) {
          return data[0].map(item => item[0]).join("");
        }
      }
    } catch (e) {
      console.warn("Primary translation endpoint error, trying fallback...", e);
    }

    // 2. Fallback: MyMemory API
    try {
      const mmUrl = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=zh-CN|en";
      const mmRes = await fetch(mmUrl);
      if (mmRes.ok) {
        const mmData = await mmRes.json();
        if (mmData && mmData.responseData && mmData.responseData.translatedText) {
          return mmData.responseData.translatedText;
        }
      }
    } catch (e) {
      console.error("Fallback translation error:", e);
    }

    throw new Error("Unable to translate at the moment. Please check your internet connection.");
  }

  /* ── Display Results ── */
  function showResult(englishText, originalChinese = "") {
    const sec = document.getElementById("output-section");
    const out = document.getElementById("translation-text");
    const detBox = document.getElementById("detected-box");
    const detText = document.getElementById("detected-text");

    out.textContent = englishText;
    sec.classList.add("visible");

    if (originalChinese) {
      detText.textContent = originalChinese;
      detBox.style.display = "block";
    } else {
      detBox.style.display = "none";
    }
  }

  /* ── Text Translation Handler ── */
  async function handleTextTranslate() {
    const text = document.getElementById("chinese-text").value.trim();
    if (!text) return alert("Please enter some Chinese text first.");

    const btn = document.getElementById("btn-text-translate");
    btn.disabled = true;
    btn.textContent = "Translating…";

    try {
      const translated = await translateChinese(text);
      showResult(translated);
    } catch (err) {
      showResult("Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Translate to English";
    }
  }

  /* ── Live Speech Recognition (Web Speech API) ── */
  let recognition = null;
  let isListening = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function toggleSpeechRecognition() {
    if (!SpeechRecognition) {
      alert("Your browser does not support speech recognition. Please use Google Chrome, Microsoft Edge, or Safari.");
      return;
    }

    const micBtn = document.getElementById("mic-toggle-btn");
    const statusText = document.getElementById("mic-status-text");

    if (isListening) {
      if (recognition) recognition.stop();
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "zh-CN";       // Mandarin Chinese
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add("listening");
      statusText.innerHTML = "🎙️ <b>Listening…</b> Speak Chinese now.";
    };

    recognition.onresult = async (event) => {
      const chineseTranscript = event.results[0][0].transcript;
      statusText.innerHTML = "Translating speech…";

      try {
        const english = await translateChinese(chineseTranscript);
        showResult(english, chineseTranscript);
        statusText.innerHTML = "✅ Translated! Click mic to speak again.";
      } catch (e) {
        showResult("Error: " + e.message, chineseTranscript);
        statusText.innerHTML = "Translation failed.";
      }
    };

    recognition.onerror = (event) => {
      console.error("Speech recognition error:", event.error);
      statusText.textContent = "Error: " + event.error + ". Click mic to try again.";
      micBtn.classList.remove("listening");
      isListening = false;
    };

    recognition.onend = () => {
      micBtn.classList.remove("listening");
      isListening = false;
    };

    recognition.start();
  }

  /* ── Text-to-Speech (English Pronunciation) ── */
  function speakTranslation() {
    const text = document.getElementById("translation-text").textContent.trim();
    if (!text || !('speechSynthesis' in window)) return;

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";

    const btn = document.getElementById("tts-btn");
    btn.textContent = "🔊 Playing…";
    utterance.onend = () => { btn.textContent = "🔊 Listen"; };
    utterance.onerror = () => { btn.textContent = "🔊 Listen"; };

    window.speechSynthesis.speak(utterance);
  }

  /* ── Copy to Clipboard ── */
  function copyTranslation() {
    const text = document.getElementById("translation-text").textContent.trim();
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById("copy-btn");
      btn.textContent = "✅ Copied!";
      setTimeout(() => btn.textContent = "📋 Copy", 2000);
    });
  }

  /* ── Enter key shortcut for text translation ── */
  document.getElementById("chinese-text").addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key === "Enter") handleTextTranslate();
  });
</script>
</body>
</html>
